name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The domain is not in home-assistant/brands (yet); skip that check.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-homeassistant-custom-component beautifulsoup4 aiohttp
      - run: pytest tests/ -q

  # Oldest supported HA: keep in sync with hacs.json "homeassistant" (#10).
  tests-min-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 0.13.132 pins homeassistant==2024.6.0; josepy<2 keeps its acme importable.
      - run: pip install "pytest-homeassistant-custom-component==0.13.132" "josepy<2" beautifulsoup4
      - run: pytest tests/ -q
